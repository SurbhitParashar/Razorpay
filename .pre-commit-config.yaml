default_language_version:
  python: python3.13

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false

      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check .
        language: system
        pass_filenames: false

      - id: mypy
        name: MyPy
        entry: uv run mypy src tests
        language: system
        pass_filenames: false

      - id: pytest
        name: Pytest
        entry: uv run pytest
        language: system
        pass_filenames: false